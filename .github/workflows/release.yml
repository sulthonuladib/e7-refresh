name: Release

# Tagging a commit is the manual release trigger. The workflow builds every
# supported platform and publishes the artifacts to that GitHub release.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tag
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # MyGo skips the Windows installer without NSIS. Install it so the
      # release carries a setup exe alongside the portable executable.
      - name: Install NSIS
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis

      - name: Set version from the tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION="$VERSION" python3 - <<'PY'
          import json, os
          path = "mygo.json"
          with open(path) as f:
              config = json.load(f)
          config["version"] = os.environ["VERSION"]
          with open(path, "w") as f:
              json.dump(config, f, indent=2)
              f.write("\n")
          PY

      - name: Build every platform
        run: |
          go tool mygo build \
            -platform linux/amd64,linux/arm64,windows/amd64,windows/arm64 \
            -o build

      - name: Collect release artifacts
        run: |
          mkdir -p release
          for dir in build/*/; do
            [ -d "$dir" ] || continue
            platform="$(basename "$dir")"
            for file in "$dir"*; do
              [ -f "$file" ] || continue
              cp "$file" "release/${platform}-$(basename "$file")"
            done
          done
          (cd release && sha256sum * > SHA256SUMS)
          ls -lh release

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
